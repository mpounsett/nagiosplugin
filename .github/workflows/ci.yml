name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --group lint
      - name: Run tests
        run: python -m pytest tests

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --group docs
      - name: Build documentation
        run: make docs

  quality:
    name: Ruff critical checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Reject critical Python errors
        run: >-
          ruff check
          --isolated
          --select E9,F63,F7,F82
          nagiosplugin tests

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . --group lint bandit pip-audit
      - name: Reject new Bandit findings
        run: >-
          bandit
          --configfile bandit.toml
          --recursive nagiosplugin
          --baseline .github/security/bandit-baseline.json
      - name: Audit Python dependencies
        run: pip-audit --skip-editable

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - tests
      - documentation
      - quality
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$TESTS_RESULT" != "success" ||
                "$DOCUMENTATION_RESULT" != "success" ||
                "$QUALITY_RESULT" != "success" ||
                "$SECURITY_RESULT" != "success" ]]; then
            echo "One or more required CI jobs did not succeed."
            exit 1
          fi
