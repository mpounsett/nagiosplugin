version: 2

updates:
  - package-ecosystem: uv
    directory: /
    target-branch: main
    # Preserve Python-version-specific development-tool resolutions in uv.lock.
    versioning-strategy: lockfile-only
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
