[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nagiosplugin"
description = "Class library for writing Nagios (Icinga) plugins"
authors = [
    { name = "Christian Kauhaus", email = "kc@flyingcircus.io" }
]
maintainers = [
    { name = "Matthew Pounsett", email = "matt@conundrum.com" }
]
readme = "README.txt"
license = { text = "ZPL-2.1" }
keywords = ["Nagios", "Icinga", "plugin", "check", "monitoring"]
requires-python = ">= 3.10"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Plugins',
    'Intended Audience :: Developers',
    'Intended Audience :: System Administrators',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: System :: Monitoring',
]
dynamic = ["version"]

[project.urls]
Documentation = "https://nagiosplugin.readthedocs.io/"
Download = "https://pypi.org/project/nagiosplugin/"
Source = "https://github.com/mpounsett/nagiosplugin"
Issues = "https://github.com/mpounsett/nagiosplugin/issues"
Changelog = "https://github.com/mpounsett/nagiosplugin/blob/main/HISTORY.txt"

[tool.setuptools.dynamic]
version = {attr = 'nagiosplugin.__version__'}

[tool.setuptools.packages.find]
include = ["nagiosplugin*"]

[tool.setuptools.package-data]
nagiosplugin = [
    "CONTRIBUTORS.txt",
    "HACKING.txt",
    "HISTORY.txt",
    "LICENSE.txt",
    "README.txt"
]
"nagiosplugin.doc" = [
    "Makefile",
    "*.rst",
    "*.py",
]
"nagiosplugin.tests" = [
    "*.py",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "__pycache__",
    "*.pyc",
    "*.pyo"
]

[dependency-groups]
build = [
    "twine",
]
docs = [
    "sphinx==8.2.3",
    "sphinx-rtd-theme",
]
dev = [
    "tox",
    "tox-uv",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "security"},
    {include-group = "docs"},
    {include-group = "build"},
]
# Lint and type-check tooling.  Tool versions come from uv.lock: tox installs
# this group via tox-uv's uv-venv-lock-runner and CI installs the same group,
# so neither can drift.
lint = [
    "mypy",
    "ruff",
]
security = [
    "bandit",
    "pip-audit",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov",
]

[tool.uv.dependency-groups]
docs = {requires-python = ">=3.11"}
dev = {requires-python = ">=3.11"}
lint = {requires-python = ">=3.11"}
security = {requires-python = ">=3.11"}

[tool.bandit]
exclude_dirs = [
    "nagiosplugin/examples/"
]

[tool.ruff]
line-length = 100
respect-gitignore = true

[tool.ruff.lint]
# ruff's defaults plus the flake8-like set, pydocstyle (D, replacing the
# standalone pydocstyle tool) and mccabe complexity (C901)
extend-select = ["D", "E", "F", "W", "C901"]

[tool.ruff.lint.per-file-ignores]
# test module/class/method names are self-describing; don't require docstrings
"tests/*" = ["D100", "D101", "D102"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.tox]
envlist = [
    "clean", "bandit", "pip-audit", "ruff",
    "py310", "py311", "py312", "py313",
    "stats"
]
skip_missing_interpreters = false

[tool.tox.env_run_base]
description = "run unit tests"
runner = "uv-venv-lock-runner"
commands = [
    [
        "pytest",
        "--cov=nagiosplugin",
        "--cov-report=html",
        "--cov-append",
        {replace = "posargs", default = ["tests"], extend = true}
    ]
]
dependency_groups = ["test"]

[tool.tox.env.bandit]
description = "run bandit security scan"
commands = [
    ["bandit", "-c", "pyproject.toml", "-b", ".github/security/bandit-baseline.json",
     "-r", "nagiosplugin", "-q"]
]
dependency_groups = ["security"]
ignore_errors = true

[tool.tox.env.ruff]
description = "run ruff"
commands = [["ruff", "check", "nagiosplugin", "tests"]]
dependency_groups = ["lint"]
ignore_errors = true

[tool.tox.env.pip-audit]
description = "run pip-audit"
commands = [["pip-audit", "--skip-editable"]]
dependency_groups = ["security"]
ignore_errors = true

# not in envlist; run on demand with `tox -e mypy` until the codebase is typed
[tool.tox.env.mypy]
description = "run mypy static type check"
commands = [["mypy", "nagiosplugin", "tests"]]
# needs the project and the test deps installed so imports resolve to real types
dependency_groups = ["lint", "test"]
ignore_errors = true

[tool.tox.env.clean]
description = "clean coverage data"
commands = [["coverage", "erase"]]
dependency_groups = ["test"]
skip_install = true

[tool.tox.env.stats]
description = "generate coverage report"
commands = [
    ["coverage", "report"],
    ["coverage", "html"]
]
dependency_groups = ["test"]
skip_install = true
