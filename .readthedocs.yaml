# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-lts-latest
  tools:
    # See
    # https://docs.readthedocs.com/platform/stable/config-file/v2.html#build-tools-python
    # for supported python versions. Don't use `latest` because this needs to
    # be synced with CI, which might have a different `latest`.
    python: "3.14"
    # You can also specify other tool versions:
    # nodejs: "20"
    # rust: "1.70"
    # golang: "1.20"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  # You can configure Sphinx to use a different builder, for instance, use the
  # dirhtml builder for simpler URLs
  # builder: "dirhtml"
  # Fail on all warnings to avoid broken references
  # fail_on_warning: true

# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
